name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check src app scripts tests
      - name: Tests rápidos (datos, fuga, DAG, artefactos, app)
        run: pytest -m "not slow"
